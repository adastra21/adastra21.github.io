<footer class="footer">
  <div class="footer-social">
    {% include social.html %}
  </div>
  <ul class="footer-menu">
    {% assign sorted_footer = site.data.menus.footer | sort: "weight" %}
    {% for item in sorted_footer %}
    <li><a href="{{ site.url }}{{ item.url }}">{{ item.name }}</a></li>
    {% endfor %}
  </ul>
  <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
</footer>
